<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kuesioner Usahatani</title>
  <style>
:root {
  --bg: #f4f6f5;
  --paper: #ffffff;
  --ink: #1b2420;
  --muted: #5a665f;
  --line: #d9dfdb;
  --line-strong: #b8c2bc;
  --accent: #1f5c44;
  --accent-dark: #174735;
  --accent-weak: #e7f0ea;
  --danger: #b3261e;
  --danger-weak: #fdeceb;
  --radius: 6px;
  --bar-h: 118px;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
[hidden] { display: none !important; }

/* ---------- bilah atas ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 960px; margin: 0 auto; padding: 10px 16px 8px; }
.topbar-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 0.9rem; }
.topbar-title { font-weight: 650; }
.prog { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0; overflow: hidden; }
.prog-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
@media (prefers-reduced-motion: reduce) { .prog-bar { transition: none; } }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  flex: 0 0 auto;
  min-width: 34px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  color: var(--ink);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  background: var(--paper);
}
.chip[data-state="part"] { background: var(--accent-weak); }
.chip[data-state="done"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- halaman ---------- */
.page {
  max-width: 960px;
  margin: 20px auto 56px;
  padding: 28px 32px 36px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.head { padding-bottom: 18px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; }
.head h1 { font-size: 1.75rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin-top: 6px; color: var(--muted); }
.head .small { margin-top: 10px; min-height: 1.3em; }

.block { margin-bottom: 20px; }
.consent { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfa; }
.consent p { margin-bottom: 10px; }
.howto { margin-bottom: 8px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-weak); }
.howto h2 { font-size: 0.95rem; margin-bottom: 4px; }
.howto p { font-size: 0.92rem; color: #2c3a33; }

.meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }

.sec { padding-top: 28px; scroll-margin-top: var(--bar-h); }
.sec h2 {
  font-size: 1.15rem;
  font-weight: 700;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  color: var(--accent-dark);
}

/* ---------- baris pertanyaan ---------- */
.q-row {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 8px 24px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.q-label { display: flex; gap: 10px; }
.q-label .no { flex: 0 0 2.2em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.q-label .txt { font-weight: 500; }
.q-row.is-table { grid-template-columns: minmax(0, 1fr); }
.q-row.is-table .q-label .txt { font-weight: 650; }

.fields { display: flex; flex-direction: column; gap: 12px; }
.fields.multi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.flabel { font-size: 0.82rem; color: var(--muted); font-weight: 600; }

/* ---------- kolom isian ---------- */
input[type="text"], input[type="date"], select, textarea {
  width: 100%;
  min-height: 42px;
  padding: 8px 10px;
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
}
textarea { resize: vertical; min-height: 84px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, .table-scroll:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(31, 92, 68, 0.25);
}
input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-weak); }
.field.invalid > .flabel { color: var(--danger); }
.err { color: var(--danger); font-size: 0.82rem; }

.num { display: flex; align-items: center; gap: 8px; }
.num input { width: 9em; flex: 0 1 9em; }
.adorn { color: var(--muted); font-size: 0.92rem; white-space: nowrap; }
.tt {
  margin-left: auto;
  min-width: 40px;
  height: 34px;
  padding: 0 8px;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  cursor: pointer;
}
.fields.multi .tt { margin-left: 0; }
.tt:hover { background: var(--accent-weak); }
.tt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- pilihan ---------- */
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: #fff;
  cursor: pointer;
  line-height: 1.3;
}
.opt input { width: 18px; height: 18px; margin: 0; flex: 0 0 auto; accent-color: var(--accent); }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { background: var(--accent-weak); border-color: var(--accent); font-weight: 600; }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }

.extras { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.extras:empty { margin: 0; }
.extra { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.extra input { flex: 1 1 12em; max-width: 24em; }
.extra input[data-kind="num"] { flex: 0 1 9em; }

/* ---------- tabel ---------- */
.table-block { margin-top: 4px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.grid { width: 100%; min-width: 820px; border-collapse: collapse; font-size: 0.92rem; }
table.grid.narrow { min-width: 0; max-width: 520px; }
.grid th, .grid td { padding: 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.grid thead th {
  padding: 8px 8px;
  font-size: 0.8rem;
  font-weight: 650;
  line-height: 1.25;
  background: #eef2ef;
  border-bottom: 1px solid var(--line-strong);
}
.grid tbody th { padding: 6px 8px; font-weight: 500; min-width: 190px; background: #fff; }
.grid tbody tr:last-child th, .grid tbody tr:last-child td { border-bottom: 0; }
.grid td { min-width: 96px; }
.grid td input, .grid td select, .grid th input { min-height: 38px; padding: 4px 8px; }
.grid th.sticky { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
.grid thead th.sticky { background: #eef2ef; }
.grid tfoot th, .grid tfoot td { padding: 8px; background: #fafbfa; border-top: 1px solid var(--line-strong); font-weight: 650; }
.grid tfoot th.sticky { background: #fafbfa; }
.sum { font-variant-numeric: tabular-nums; }
.hint { margin-top: 6px; font-size: 0.82rem; color: var(--muted); }

/* ---------- bagian akhir ---------- */
.end { margin-top: 26px; margin-bottom: 0; }
.thanks { margin: 18px 0; font-style: italic; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn {
  min-height: 44px;
  padding: 8px 18px;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  cursor: pointer;
}
.btn:hover { background: var(--accent-weak); }
.btn.primary { margin-left: auto; color: #fff; background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-dark); }
.btn:disabled { opacity: 0.6; cursor: wait; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.errors { padding: 12px 16px; margin-bottom: 12px; color: #6e1510; background: var(--danger-weak); border: 1px solid #f0b8b4; border-radius: var(--radius); }
.errors ul { margin: 6px 0 0; padding-left: 20px; }
.linklike { padding: 0; font: inherit; color: inherit; text-align: left; text-decoration: underline; background: none; border: 0; cursor: pointer; }

/* ---------- dialog ---------- */
dialog { width: min(92vw, 480px); padding: 22px; border: 1px solid var(--line-strong); border-radius: 8px; color: var(--ink); }
dialog::backdrop { background: rgba(20, 28, 24, 0.45); }
dialog h2 { font-size: 1.15rem; margin-bottom: 8px; }
dialog p + p { margin-top: 8px; }
.links { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.links a { color: var(--accent-dark); font-weight: 600; }
dialog .actions .btn.primary { margin-left: 0; }

/* ---------- layar kecil ---------- */
@media (max-width: 720px) {
  :root { --bar-h: 112px; }
  .page { margin: 0; padding: 20px 14px 40px; border: 0; border-radius: 0; }
  .meta-grid, .fields.multi { grid-template-columns: minmax(0, 1fr); }
  .q-row { grid-template-columns: minmax(0, 1fr); }
  .head h1 { font-size: 1.45rem; }
  .btn { flex: 1 1 100%; }
  .btn.primary { margin-left: 0; order: -1; }
  .topbar-row { font-size: 0.82rem; }

  /* tabel menjadi kartu per baris di layar kecil */
  .table-scroll { overflow: visible; border: 0; }
  table.grid, table.grid.narrow { min-width: 0; max-width: none; }
  .grid, .grid tbody, .grid tfoot { display: block; }
  .grid thead { position: absolute; left: -9999px; }
  .grid tbody tr {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 10px;
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .grid tbody th.sticky, .grid tfoot th.sticky {
    position: static;
    grid-column: 1 / -1;
    min-width: 0;
    padding: 0;
    border: 0;
    box-shadow: none;
    font-weight: 650;
    background: transparent;
  }
  .grid td { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0; border: 0; }
  .grid td::before { content: attr(data-label); font-size: 0.78rem; font-weight: 600; color: var(--muted); }
  .grid tfoot tr { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px; background: #fafbfa; border: 1px solid var(--line-strong); border-radius: var(--radius); }
  .grid tfoot th, .grid tfoot td { padding: 0; border: 0; background: transparent; }
  .grid tfoot th { grid-column: auto; }
  .grid td.blank { display: none; }
}

/* ---------- cetak ---------- */
#print-view { display: none; }

@media print {
  body { background: #fff; font-size: 10pt; }
  .topbar, #app, dialog { display: none !important; }
  #print-view { display: block; color: #000; }
  #print-view h1 { font-size: 15pt; margin-bottom: 2px; }
  #print-view .p-sub { margin-bottom: 10px; }
  #print-view h2 { font-size: 11pt; margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1.5px solid #000; break-after: avoid; }
  #print-view h3 { font-size: 10pt; margin: 10px 0 4px; break-after: avoid; }
  #print-view table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  #print-view th, #print-view td { padding: 3px 5px; border: 1px solid #888; text-align: left; vertical-align: top; font-size: 9pt; }
  #print-view th { background: #eee; }
  #print-view .p-meta th { width: 17%; }
  #print-view .p-meta td { width: 33%; }
  #print-view .c-no { width: 6%; text-align: center; }
  #print-view .p-qa td:nth-child(2) { width: 46%; }
  #print-view tr { break-inside: avoid; }
  #print-view .p-note { white-space: pre-wrap; border: 1px solid #888; padding: 6px; min-height: 40px; }
}

</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-in">
      <div class="topbar-row">
        <strong class="topbar-title">Kuesioner Usahatani</strong>
        <span id="prog-text" class="muted">0 dari 97 pertanyaan terisi</span>
      </div>
      <div id="prog" class="prog" role="progressbar" aria-label="Kemajuan pengisian" aria-valuemin="0" aria-valuenow="0" aria-valuemax="97">
        <div id="prog-bar" class="prog-bar"></div>
      </div>
      <nav id="chips" class="chips" aria-label="Lompat ke bagian"></nav>
    </div>
  </div>

  <main id="app" class="page">
    <header class="head">
      <h1 id="title">Kuesioner Usahatani</h1>
      <p id="subtitle" class="sub"></p>
      <p id="saved" class="muted small" aria-live="polite"></p>
    </header>
    <form id="form" novalidate autocomplete="off"></form>
    <noscript><p>Halaman ini membutuhkan JavaScript agar dapat diisi.</p></noscript>
  </main>

  <dialog id="result">
    <div id="result-body"></div>
  </dialog>

  <div id="print-view" aria-hidden="true"></div>

  <script>
window.APP_CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbzWYMobzJlLZPuGrSLoOXGtVeUXCGUE028sSjLYBfIknsckH7uZy7sIYC32Sy9P0yvNrg/exec',
};

</script>
  <script>
/*
  Daftar pertanyaan Kuesioner Usahatani (urutan & pilihan sama dengan dokumen Word).
  Untuk mengubah teks/pilihan, cukup edit file ini.

  Jenis isian (type):
    text, tel, textarea, date, num (angka, boleh "TT"), radio (pilih satu), check (boleh lebih dari satu)
  Pilihan (opts): teks biasa, atau objek:
    { v: 'Lainnya', input: 'text' }                       -> muncul kolom tulis
    { v: 'Ya', input: 'num', unit: 'kali per tahun' }     -> muncul kolom angka
    { v: 'Tidak pernah', excl: true }                     -> tidak bisa digabung dengan pilihan lain
*/

const OTHER = { v: 'Lainnya', input: 'text' };
const NONE = (v) => ({ v, excl: true });
const OPT = (v, x) => Object.assign({ v }, x);

window.FORM = {
  title: 'Kuesioner Usahatani',
  subtitle: 'Mata Kuliah Manajemen Usahatani – Team-Based Project (TBP)',

  meta: [
    { key: 'h_komoditas', label: 'Komoditas', type: 'text', req: true },
    { key: 'h_varietas', label: 'Varietas/jenis', type: 'text' },
    { key: 'h_desa', label: 'Desa Wisata', type: 'text' },
    { key: 'h_jenis', label: 'Jenis tanaman', type: 'radio', opts: ['Musiman', 'Tahunan'] },
    { key: 'h_pewawancara', label: 'Pewawancara', type: 'text', req: true },
    { key: 'h_tanggal', label: 'Tanggal', type: 'date', req: true },
    { key: 'h_kode', label: 'Kode responden', type: 'text', req: true },
    { key: 'h_periode', label: 'Periode data', type: 'radio', opts: ['1 musim tanam', '1 musim panen', OTHER] },
  ],

  consentText:
    'Data ini hanya dipakai untuk tugas perkuliahan dan dijaga kerahasiaannya. Bapak/Ibu bersedia diwawancarai?',
  consent: { key: 'h_consent', label: 'Persetujuan responden', type: 'radio', opts: ['Bersedia', 'Tidak bersedia'], req: true },

  howTo:
    'Beri tanda ✓ pada kotak yang sesuai, atau tulis jawaban pada kolom yang tersedia. Tulis satuan setiap angka (Rp, kg, are, hari). ' +
    'Jika jawaban tidak ada di pilihan, pilih "Lainnya" lalu tulis jawabannya. Jika petani tidak tahu atau lupa, tulis "TT". ' +
    'Semua data diambil dari satu periode yang sama (satu musim tanam terakhir untuk tanaman musiman, satu musim panen untuk tanaman tahunan).',

  sections: [
    {
      id: 'A',
      title: 'Karakteristik Petani',
      items: [
        { no: 1, q: 'Siapa nama Bapak/Ibu?', f: [{ type: 'text' }] },
        { no: 2, q: 'Alamat tinggal (banjar/dusun, desa)?', f: [{ type: 'text' }] },
        { no: 3, q: 'Nomor HP yang bisa dihubungi (boleh dikosongkan)?', f: [{ type: 'tel' }] },
        { no: 4, q: 'Jenis kelamin?', f: [{ type: 'radio', opts: ['Laki-laki', 'Perempuan'] }] },
        { no: 5, q: 'Umur Bapak/Ibu sekarang?', f: [{ type: 'num', unit: 'tahun' }] },
        { no: 6, q: 'Status perkawinan?', f: [{ type: 'radio', opts: ['Belum menikah', 'Menikah', 'Cerai', 'Duda/Janda', OTHER] }] },
        { no: 7, q: 'Pendidikan terakhir?', f: [{ type: 'radio', opts: ['Tidak sekolah', 'TK', 'SD', 'SMP', 'SMA/SMK', 'Kuliah (Diploma/Sarjana)', OTHER] }] },
        { no: 8, q: 'Sudah berapa tahun bertani?', f: [{ type: 'num', unit: 'tahun' }] },
        { no: 9, q: 'Pekerjaan utama Bapak/Ibu apa?', f: [{ type: 'radio', opts: ['Bertani', 'Buruh tani', 'Berdagang', 'Pegawai (negeri/swasta)', 'Kerja di pariwisata', OTHER] }] },
        { no: 10, q: 'Apakah ada pekerjaan lain selain bertani?', f: [{ type: 'radio', opts: ['Tidak', OPT('Ada', { input: 'text', ask: 'yaitu' })] }] },
        { no: 11, q: 'Berapa orang yang tinggal serumah dan ditanggung?', f: [{ type: 'num', unit: 'orang' }] },
        { no: 12, q: 'Dari jumlah itu, berapa orang yang ikut bekerja di kebun/sawah?', f: [{ type: 'num', unit: 'orang' }] },
        { no: 13, q: 'Apakah ikut kelompok tani/subak?', f: [{ type: 'radio', opts: [OPT('Ya', { input: 'text', ask: 'nama kelompok' }), 'Tidak'] }] },
      ],
    },
    {
      id: 'B',
      title: 'Lahan',
      items: [
        { no: 14, q: 'Berapa total luas lahan yang digarap?', f: [{ type: 'num', unit: 'are' }] },
        { no: 15, q: 'Lahan itu status apa?', f: [{ type: 'check', opts: ['Milik sendiri', 'Sewa', 'Bagi hasil', OTHER] }] },
        {
          no: 16,
          q: 'Berapa luas lahan menurut statusnya?',
          f: [
            { k: 'milik', label: 'Milik sendiri', type: 'num', unit: 'are' },
            { k: 'sewa', label: 'Sewa', type: 'num', unit: 'are' },
            { k: 'bagi', label: 'Bagi hasil', type: 'num', unit: 'are' },

          ],
        },
        { no: 17, q: 'Jika bagi hasil, berapa bagian untuk pemilik lahan?', f: [{ type: 'num', unit: '% dari hasil panen' }] },
        {
          no: 18,
          q: 'Lahan ada di mana, dan berapa jauh dari rumah?',
          f: [
            { k: 'lokasi', label: 'Lokasi', type: 'text' },
            { k: 'jarak', label: 'Jarak', type: 'num', unit: 'km' },
          ],
        },
        { no: 19, q: 'Lahan termasuk jenis apa?', f: [{ type: 'check', opts: ['Sawah', 'Tegalan/ladang', 'Kebun', 'Pekarangan', OTHER] }] },
        { no: 20, q: 'Lahan terdiri dari berapa petak/bidang?', f: [{ type: 'num', unit: 'petak' }] },
        { no: 21, q: 'Bentuk permukaan lahan?', f: [{ type: 'radio', opts: ['Datar', 'Miring/berteras', 'Curam', OTHER] }] },
        { no: 22, q: 'Bagaimana kesuburan tanah menurut Bapak/Ibu?', f: [{ type: 'radio', opts: ['Subur', 'Sedang', 'Kurang subur', 'Tidak tahu'] }] },
        { no: 23, q: 'Air untuk tanaman berasal dari mana?', f: [{ type: 'check', opts: ['Subak/irigasi', 'Hujan', 'Sumur/pompa', OTHER] }] },
        { no: 24, q: 'Apakah air cukup selama masa tanam?', f: [{ type: 'radio', opts: ['Cukup', 'Kadang kurang', 'Sering kurang'] }] },
      ],
    },
    {
      id: 'C',
      title: 'Komoditas dan Cara Budidaya',
      items: [
        { no: 25, q: 'Tanaman apa yang ditanam? (tulis nama tanamannya)', f: [{ type: 'text' }] },
        { no: 26, q: 'Varietas/jenis apa yang ditanam? (tulis nama bibit/benihnya)', f: [{ type: 'text' }] },
        {
          no: 27,
          q: 'Tanaman ini termasuk jenis apa?',
          f: [{ type: 'radio', opts: ['Musiman (sekali panen, mis. padi, sayur, cabai)', 'Tahunan (mis. kopi, jeruk, manggis)', OTHER] }],

  <script>
(() => {
  'use strict';

  const F = window.FORM;
  const CFG = window.APP_CONFIG || {};
  const STORE = 'kuesioner-usahatani-draft-v1';
  const CARRY = ['h_komoditas', 'h_varietas', 'h_desa', 'h_jenis', 'h_pewawancara', 'h_tanggal', 'h_periode'];
  const MIRROR = { h_komoditas: 'q25', h_varietas: 'q26' };
  const ALL_ITEMS = F.sections.flatMap((s) => s.items);

  /* ---------- util ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  function h(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach((c) => {
      if (c === null || c === undefined || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
    return e;
  }

  const uid = () =>
    window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

  function today() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const optObj = (o) => (typeof o === 'string' ? { v: o } : o);
  const keyOf = (item, f) => (item.f.length === 1 ? `q${item.no}` : `q${item.no}_${f.k}`);
  const ariaOf = (item, f) => (f.label ? `${item.q} – ${f.label}` : item.q);

  /* Angka: terima "TT", angka biasa, atau angka dengan pemisah ribuan. Kembalikan null jika tidak valid. */
  function normNum(s) {
    s = String(s ?? '').trim();
    if (!s) return '';
    if (/^tt$/i.test(s)) return 'TT';
    if (/^[1-9]\d{0,2}([.,]\d{3})+$/.test(s)) return s.replace(/[.,]/g, '');
    if (/^\d+([.,]\d+)?$/.test(s)) return s.replace(',', '.');
    return null;
  }
  function toNumber(s) {
    const n = normNum(s);
    return typeof n === 'string' && n !== '' && n !== 'TT' ? Number(n) : null;
  }
  const rupiah = (n) => 'Rp ' + n.toLocaleString('id-ID');

  /* ---------- state ---------- */
  const freshState = () => ({ id: uid(), v: { h_tanggal: today() }, savedId: null });
  let state = null;
  try {
    state = JSON.parse(localStorage.getItem(STORE));
  } catch (e) {
    state = null;
  }
  if (!state || !state.v) state = freshState();

  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE, JSON.stringify(state));
        const t = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        $('#saved').textContent = `Draf tersimpan di perangkat ini pukul ${t}`;
      } catch (e) {
        $('#saved').textContent = 'Draf tidak dapat disimpan di perangkat ini';
      }
    }, 400);
  }

  function setVal(key, val) {
    if (val === '' || val === null || val === undefined || (Array.isArray(val) && !val.length)) delete state.v[key];
    else state.v[key] = val;
    scheduleSave();
    scheduleRefresh();
  }
  const getSel = (key) => {
    const v = state.v[key];
    return Array.isArray(v) ? v : v ? [v] : [];
  };

  /* ---------- render: fields ---------- */
  function renderNum(key, f, aria) {
    const inp = h('input', {
      type: 'text',
      inputmode: 'decimal',
      autocomplete: 'off',
      'data-key': key,
      'data-kind': 'num',
      'aria-label': aria,
      placeholder: f.ph,
    });
    return h(
      'div',
      { class: 'num' },
      f.prefix ? h('span', { class: 'adorn' }, f.prefix) : null,
      inp,
      f.unit ? h('span', { class: 'adorn' }, f.unit) : null,
      h('button', { type: 'button', class: 'tt', 'data-tt': '1', title: 'Petani tidak tahu atau lupa (isi TT)', 'aria-label': 'Isi TT' }, 'TT')
    );
  }

  function renderChoice(key, f, aria) {
    const multi = f.type === 'check';
    const box = h('div', { class: 'choice', 'data-key': key });
    const opts = h('div', { class: 'opts', role: multi ? 'group' : 'radiogroup', 'aria-label': aria });
    const extras = h('div', { class: 'extras' });
    f.opts.forEach((o0, i) => {
      const o = optObj(o0);
      const inp = h('input', {
        type: multi ? 'checkbox' : 'radio',
        name: key,
        value: o.v,
        'data-key': key,
        'data-kind': multi ? 'check' : 'radio',
        'data-excl': o.excl ? '1' : null,
      });
      opts.append(h('label', { class: 'opt' }, inp, h('span', {}, o.v)));
      if (o.input) {
        const ek = `${key}|${i}`;
        const ia = `${aria} – ${o.v}`;
        const field =
          o.input === 'num'
            ? h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'data-key': ek, 'data-kind': 'num', 'aria-label': ia })
            : h('input', { type: 'text', autocomplete: 'off', 'data-key': ek, 'data-kind': 'text', 'aria-label': ia, placeholder: 'Tulis jawaban' });
        extras.append(
          h(
            'label',
            { class: 'extra', 'data-val': o.v, hidden: true },
            h('span', { class: 'flabel' }, cap(o.ask || o.v)),
            o.prefix ? h('span', { class: 'adorn' }, o.prefix) : null,
            field,
            o.unit ? h('span', { class: 'adorn' }, o.unit) : null
          )
        );
      }
    });
    box.append(opts, extras);
    return box;
  }

  function renderField(key, f, aria) {
    const wrap = h('div', { class: 'field' + (f.type === 'textarea' ? ' wide' : '') });
    if (f.label) wrap.append(h('span', { class: 'flabel' }, f.label));
    if (f.type === 'radio' || f.type === 'check') wrap.append(renderChoice(key, f, aria));
    else if (f.type === 'num') wrap.append(renderNum(key, f, aria));
    else if (f.type === 'textarea')
      wrap.append(h('textarea', { rows: 3, autocomplete: 'off', 'data-key': key, 'data-kind': 'text', 'aria-label': aria }));
    else
      wrap.append(
        h('input', {
          type: f.type === 'date' ? 'date' : 'text',
          inputmode: f.type === 'tel' ? 'tel' : null,
          autocomplete: 'off',
          'data-key': key,
          'data-kind': 'text',
          'aria-label': aria,
          placeholder: f.ph,
        })
      );
    return wrap;
  }

  /* ---------- render: tabel ---------- */
  function renderTable(item) {
    const tb = item.table;
    const no = item.no;
    const thead = h(
      'thead',
      {},
      h('tr', {}, h('th', { scope: 'col', class: 'sticky' }, tb.rowHead), tb.cols.map((c) => h('th', { scope: 'col' }, c.h)))
    );
    const rows = tb.rows.map((label, i) => ({ label, i }));
    if (tb.other) rows.push({ other: true, i: tb.rows.length });

    const tbody = h('tbody');
    rows.forEach((r) => {
      const tr = h('tr');
      const rowName = r.other ? `${tb.rowHead} lainnya` : r.label;
      tr.append(
        r.other
          ? h(
              'th',
              { scope: 'row', class: 'sticky' },
              h('input', {
                type: 'text',
                autocomplete: 'off',
                placeholder: 'Lainnya: tulis nama',
                'data-key': `t${no}.r${r.i}.n`,
                'data-kind': 'text',
                'aria-label': rowName,
              })
            )
          : h('th', { scope: 'row', class: 'sticky' }, r.label)
      );
      tb.cols.forEach((c, j) => {
        const key = `t${no}.r${r.i}.c${j}`;
        const aria = `${rowName} – ${c.h}`;
        let cell;
        if (c.t === 'select') {
          cell = h(
            'select',
            { 'data-key': key, 'data-kind': 'select', 'aria-label': aria },
            h('option', { value: '' }, '–'),
            c.opts.map((o) => h('option', { value: o }, o))
          );
        } else if (c.t === 'num') {
          cell = h('input', {
            type: 'text',
            inputmode: 'decimal',
            autocomplete: 'off',
            'data-key': key,
            'data-kind': 'num',
            'data-col': j,
            'data-auto': c.auto ? c.auto.join(',') : null,
            'aria-label': aria,
          });
        } else {
          cell = h('input', { type: 'text', autocomplete: 'off', 'data-key': key, 'data-kind': 'text', 'aria-label': aria });
        }
        tr.append(h('td', { 'data-label': c.h }, cell));
      });
      tbody.append(tr);
    });

    const table = h('table', { class: 'grid' + (tb.narrow ? ' narrow' : '') }, thead, tbody);
    if (tb.cols.some((c) => c.sum)) {
      table.append(
        h(
          'tfoot',
          {},
          h(
            'tr',
            {},
            h('th', { scope: 'row', class: 'sticky' }, 'Jumlah'),
            tb.cols.map((c, j) => h('td', { 'data-label': c.sum ? c.h : null, class: c.sum ? null : 'blank' }, c.sum ? h('span', { class: 'sum', 'data-sum': `${no}.${j}` }, '–') : null))
          )
        )
      );
    }
    return h(
      'div',
      { class: 'table-block' },
      h('div', { class: 'table-scroll', tabindex: '0', role: 'region', 'aria-label': `Tabel pertanyaan ${no}` }, table),
      h('p', { class: 'hint' }, 'Isi hanya baris yang dipakai. Tulis angka saja; tulis TT jika tidak tahu.')
    );
  }

  /* ---------- render: halaman ---------- */
  function renderItem(item) {
    const row = h('div', { class: 'q-row' + (item.table ? ' is-table' : ''), id: `q${item.no}`, role: 'group', 'aria-labelledby': `ql${item.no}` });
    const label = h('div', { class: 'q-label' }, h('span', { class: 'no' }, `${item.no}.`), h('span', { class: 'txt', id: `ql${item.no}` }, item.q));
    const ans = h('div', { class: 'q-answer' });
    if (item.table) ans.append(renderTable(item));
    else {
      const fs = h('div', { class: 'fields' + (item.f.length > 1 ? ' multi' : '') });
      item.f.forEach((f) => fs.append(renderField(keyOf(item, f), f, ariaOf(item, f))));
      ans.append(fs);
    }
    row.append(label, ans);
    return row;
  }

  function build() {
    $('#title').textContent = F.title;
    $('#subtitle').textContent = F.subtitle;
    document.title = `${F.title} – ${F.subtitle}`;

    const form = $('#form');

    const metaGrid = h('div', { class: 'meta-grid' });
    F.meta.forEach((f) => metaGrid.append(renderField(f.key, f, f.label)));
    form.append(h('section', { class: 'block', 'aria-label': 'Identitas wawancara' }, metaGrid));

    const c = F.consent;
    form.append(
      h(
        'section',
        { class: 'block consent', 'aria-label': 'Persetujuan responden' },
        h('p', {}, h('strong', {}, 'Persetujuan responden: '), F.consentText),
        renderField(c.key, c, c.label)
      ),
      h('section', { class: 'howto' }, h('h2', {}, 'Cara mengisi'), h('p', {}, F.howTo))
    );

    const chips = $('#chips');
    const io = new IntersectionObserver(
      (entries) => entries.forEach((en) => en.isIntersecting && setCurrent(en.target.dataset.id)),
      { rootMargin: '-150px 0px -65% 0px' }
    );
    F.sections.forEach((s) => {
      const sec = h(
        'section',
        { class: 'sec', id: `sec-${s.id}`, 'data-id': s.id, 'aria-labelledby': `h-${s.id}` },
        h('h2', { id: `h-${s.id}` }, `${s.id}. ${s.title}`)
      );
      s.items.forEach((it) => sec.append(renderItem(it)));
      form.append(sec);
      io.observe(sec);
      chips.append(h('a', { class: 'chip', href: `#sec-${s.id}`, 'data-id': s.id, title: s.title }, s.id));
    });

    const end = h(
      'section',
      { class: 'block end' },
      h('div', { class: 'field wide' }, h('span', { class: 'flabel' }, F.note.label), h('textarea', { rows: 3, autocomplete: 'off', 'data-key': F.note.key, 'data-kind': 'text', 'aria-label': F.note.label })),
      h('p', { class: 'thanks' }, F.closing),
      h('div', { id: 'errors', class: 'errors', role: 'alert', hidden: true }),
      h(
        'div',
        { class: 'actions' },
        h('button', { type: 'button', class: 'btn', id: 'btn-clear' }, 'Kosongkan formulir'),
        h('button', { type: 'button', class: 'btn', id: 'btn-print' }, 'Cetak / simpan PDF'),
        h('button', { type: 'submit', class: 'btn primary', id: 'btn-submit' }, CFG.endpoint ? 'Simpan ke Google Sheets' : 'Selesai & periksa')
      ),
      CFG.endpoint ? null : h('p', { class: 'hint' }, 'Penyimpanan ke Google Sheets belum diaktifkan. Lihat README untuk langkah pemasangan.')
    );
    form.append(end);
  }

  function setCurrent(id) {
    $$('#chips .chip').forEach((c) => {
      if (c.dataset.id === id) {
        c.setAttribute('aria-current', 'true');
        const box = $('#chips');
        box.scrollTo({ left: c.offsetLeft - box.clientWidth / 2 + c.clientWidth / 2, behavior: 'smooth' });
      } else c.removeAttribute('aria-current');
    });
  }

  /* ---------- restore ---------- */
  function restoreAll() {
    $$('#form [data-key]').forEach((el) => {
      const k = el.dataset.key;
      const kind = el.dataset.kind;
      if (kind === 'radio' || kind === 'check') el.checked = getSel(k).includes(el.value);
      else if (kind) el.value = state.v[k] ?? '';
    });
    $$('#form .extra').forEach((ex) => {
      const key = ex.closest('.choice').dataset.key;
      ex.hidden = !getSel(key).includes(ex.dataset.val);
    });
    $$('#form [data-auto]').forEach((cell) => {
      const [a, b] = cell.dataset.auto.split(',');
      const tr = cell.closest('tr');
      const va = toNumber(tr.querySelector(`[data-col="${a}"]`).value);
      const vb = toNumber(tr.querySelector(`[data-col="${b}"]`).value);
      if (cell.value && !(va !== null && vb !== null && Number(cell.value) === Math.round(va * vb * 100) / 100)) cell.dataset.manual = '1';
      else delete cell.dataset.manual;
    });
    $$('.invalid').forEach((e) => e.classList.remove('invalid'));
    $$('[aria-invalid]').forEach((e) => e.removeAttribute('aria-invalid'));
    $$('.err').forEach((e) => e.remove());
    $('#errors').hidden = true;
    recalcSums();
    refresh();
    scheduleSave();
  }

  /* ---------- hitung otomatis ---------- */
  function autoCalc(t) {
    const tr = t.closest('tr');
    if (!tr) return;
    const cell = tr.querySelector('[data-auto]');
    if (!cell) return;
    if (t === cell) {
      if (t.value === '') delete t.dataset.manual;
      else t.dataset.manual = '1';
      return;
    }
    if (cell.dataset.manual) return;
    const [a, b] = cell.dataset.auto.split(',');
    const va = toNumber(tr.querySelector(`[data-col="${a}"]`).value);
    const vb = toNumber(tr.querySelector(`[data-col="${b}"]`).value);
    const out = va !== null && vb !== null ? String(Math.round(va * vb * 100) / 100) : '';
    cell.value = out;
    setVal(cell.dataset.key, out);
  }

  function recalcSums() {
    $$('[data-sum]').forEach((sp) => {
      const [no, j] = sp.dataset.sum.split('.');
      let total = 0;
      let any = false;
      $$(`input[data-key^="t${no}."][data-col="${j}"]`).forEach((i) => {
        const n = toNumber(i.value);
        if (n !== null) {
          total += n;
          any = true;
        }
      });
      sp.textContent = any ? rupiah(total) : '–';
    });
  }

  /* ---------- validasi tampilan ---------- */
  function markInvalid(el, msg) {
    el.setAttribute('aria-invalid', 'true');
    const f = el.closest('.field, .extra');
    if (f) {
      f.classList.add('invalid');
      if (!f.querySelector('.err')) f.append(h('span', { class: 'err' }, msg));
    }
  }
  function clearInvalid(el) {
    el.removeAttribute('aria-invalid');
    const f = el.closest('.field, .extra');
    if (f) {
      f.classList.remove('invalid');
      const e = f.querySelector('.err');
      if (e) e.remove();
    }
  }

  /* ---------- event ---------- */
  function wire() {
    const form = $('#form');

    form.addEventListener('input', (e) => {
      const t = e.target;
      const key = t.dataset && t.dataset.key;
      const kind = t.dataset && t.dataset.kind;
      if (!key || kind === 'radio' || kind === 'check') return;
      if (kind === 'num') {
        const c = t.value.replace(/[^0-9.,tT]/g, '');
        if (c !== t.value) t.value = c;
        clearInvalid(t);
      }
      const prev = state.v[key];
      setVal(key, t.value);
      if (MIRROR[key]) {
        const tk = MIRROR[key];
        if (!state.v[tk] || state.v[tk] === prev) {
          setVal(tk, t.value);
          const target = $(`[data-key="${tk}"]`);
          if (target) target.value = t.value;
        }
      }
      if (kind === 'num') {
        autoCalc(t);
        recalcSums();
      }
    });

    form.addEventListener('change', (e) => {
      const t = e.target;
      if (!t.dataset || !t.dataset.key) return;
      if (t.dataset.kind === 'select') setVal(t.dataset.key, t.value);
      if (t.dataset.kind === 'check') onCheck(t);
    });

    form.addEventListener('click', (e) => {
      const t = e.target;
      if (t.matches && t.matches('input[type="radio"][data-key]')) onRadio(t);
      const tt = t.closest && t.closest('[data-tt]');
      if (tt) {
        const inp = tt.parentElement.querySelector('input');
        inp.value = inp.value === 'TT' ? '' : 'TT';
        clearInvalid(inp);
        setVal(inp.dataset.key, inp.value);
        inp.focus();
      }
    });

    form.addEventListener('focusout', (e) => {
      const t = e.target;
      if (!t.dataset || t.dataset.kind !== 'num') return;
      const n = normNum(t.value);
      if (n === null) {
        markInvalid(t, 'Isi angka atau TT');
        return;
      }
      clearInvalid(t);
      if (n !== t.value) {
        t.value = n;
        setVal(t.dataset.key, n);
      }
      autoCalc(t);
      recalcSums();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submit();
    });

    $('#btn-clear').addEventListener('click', () => {
      if (!confirm('Hapus semua isian di formulir ini?')) return;
      state = freshState();
      restoreAll();
      window.scrollTo({ top: 0 });
    });
    $('#btn-print').addEventListener('click', printCopy);
  }

  function syncExtras(key) {
    const box = $(`.choice[data-key="${CSS.escape(key)}"]`);
    if (!box) return;
    const sel = getSel(key);
    $$('.extra', box).forEach((ex) => (ex.hidden = !sel.includes(ex.dataset.val)));
  }

  function onRadio(t) {
    const key = t.dataset.key;
    if (state.v[key] === t.value) {
      t.checked = false;
      setVal(key, '');
    } else setVal(key, t.value);
    syncExtras(key);
  }

  function onCheck(t) {
    const key = t.dataset.key;
    const group = $$(`input[type="checkbox"][data-key="${CSS.escape(key)}"]`);
    if (t.checked) group.forEach((g) => g !== t && (t.dataset.excl || g.dataset.excl) && (g.checked = false));
    setVal(
      key,
      group.filter((g) => g.checked).map((g) => g.value)
    );
    syncExtras(key);
  }

  /* ---------- jawaban -> teks ---------- */
  function optText(o, val) {
    if (!val) return o.v;
    const core = (o.prefix ? o.prefix + ' ' : '') + val + (o.unit && val !== 'TT' ? ' ' + o.unit : '');
    if (o.v === 'Lainnya') return `Lainnya: ${val}`;
    if (o.input === 'num') return `${o.v}, ${o.ask ? o.ask + ' ' : ''}${core}`;
    return o.ask ? `${o.v}, ${o.ask}: ${core}` : `${o.v}, ${core}`;
  }

  function fieldText(key, f) {
    if (f.type === 'radio' || f.type === 'check') {
      return getSel(key)
        .map((v) => {
          const i = f.opts.findIndex((o) => optObj(o).v === v);
          if (i < 0) return v;
          const o = optObj(f.opts[i]);
          if (!o.input) return v;
          return optText(o, String(state.v[`${key}|${i}`] ?? '').trim());
        })
        .join('; ');
    }
    return String(state.v[key] ?? '').trim();
  }

  function hasAnswer(it) {
    if (it.table) {
      const p = `t${it.no}.`;
      return Object.keys(state.v).some((k) => k.startsWith(p) && String(state.v[k]).trim() !== '');
    }
    return it.f.some((f) => fieldText(keyOf(it, f), f) !== '');
  }

  function itemAnswer(it) {
    const parts = [];
    it.f.forEach((f) => {
      let t = fieldText(keyOf(it, f), f);
      if (!t) return;
      if (f.type === 'num' && t !== 'TT') t = (f.prefix ? f.prefix + ' ' : '') + t + (f.unit ? ' ' + f.unit : '');
      parts.push(it.f.length > 1 && f.label ? `${f.label}: ${t}` : t);
    });
    return parts.join('\n');
  }

  /* ---------- progres ---------- */
  let raf = 0;
  function scheduleRefresh() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(refresh);
  }
  function refresh() {
    let done = 0;
    F.sections.forEach((s) => {
      let n = 0;
      s.items.forEach((it) => hasAnswer(it) && n++);
      done += n;
      const chip = $(`#chips .chip[data-id="${s.id}"]`);
      if (chip) chip.dataset.state = n === s.items.length ? 'done' : n > 0 ? 'part' : '';
    });
    const total = ALL_ITEMS.length;
    $('#prog-text').textContent = `${done} dari ${total} pertanyaan terisi`;
    $('#prog-bar').style.width = `${(done / total) * 100}%`;
    $('#prog').setAttribute('aria-valuenow', String(done));
    $('#prog').setAttribute('aria-valuemax', String(total));
  }

  /* ---------- laporan & payload ---------- */
  function typed(f, text) {
    if (f.type === 'num') {
      const n = normNum(text);
      return typeof n === 'string' && n !== '' && n !== 'TT' ? Number(n) : text;
    }
    return text;
  }

  function colName(it, f) {
    const base = `Q${it.no} ${it.q}`;
    let name = base.length > 80 ? base.slice(0, 77) + '…' : base;
    if (it.f.length > 1 && f.label) name += ` – ${f.label}`;
    if (f.type === 'num' && (f.unit || f.prefix)) name += ` (${f.prefix || f.unit})`;
    return name;
  }

  function tableData(it) {
    const tb = it.table;
    const no = it.no;
    const rows = tb.rows.map((label, i) => ({ label, i }));
    if (tb.other) rows.push({ other: true, i: tb.rows.length });
    const all = [];
    const sheetRows = [];
    rows.forEach((r) => {
      const label = r.other ? String(state.v[`t${no}.r${r.i}.n`] ?? '').trim() : r.label;
      const cells = tb.cols.map((c, j) => String(state.v[`t${no}.r${r.i}.c${j}`] ?? '').trim());
      const has = cells.some((x) => x !== '');
      if (!r.other || has || label) all.push([label || 'Lainnya', ...cells]);
      if (has || (r.other && label)) {
        sheetRows.push([label || 'Lainnya', ...cells.map((x, j) => (tb.cols[j].t === 'num' ? typed({ type: 'num' }, x) : x))]);
      }
    });
    return { headers: [tb.rowHead, ...tb.cols.map((c) => c.h)], rows: all, sheetRows };
  }

  function buildReport() {
    const meta = F.meta.map((f) => ({ l: f.label, v: fieldText(f.key, f) }));
    meta.push({ l: F.consent.label, v: fieldText(F.consent.key, F.consent) });
    const blocks = F.sections.map((s) => ({
      id: s.id,
      title: s.title,
      items: s.items.map((it) => {
        if (it.table) {
          const td = tableData(it);
          return { no: it.no, q: it.q, table: { headers: td.headers, rows: td.rows } };
        }
        return { no: it.no, q: it.q, a: itemAnswer(it) };
      }),
    }));
    return { id: state.id, title: F.title, subtitle: F.subtitle, meta, blocks, note: String(state.v[F.note.key] ?? '').trim() };
  }

  function buildPayload() {
    const flat = [
      ['ID Kiriman', state.id],
      ['Waktu kirim', new Date().toISOString()],
    ];
    F.meta.forEach((f) => flat.push([f.label, fieldText(f.key, f)]));
    flat.push([F.consent.label, fieldText(F.consent.key, F.consent)]);
    ALL_ITEMS.forEach((it) => {
      if (it.table) return;
      it.f.forEach((f) => flat.push([colName(it, f), typed(f, fieldText(keyOf(it, f), f))]));
    });
    flat.push([F.note.label, String(state.v[F.note.key] ?? '').trim()]);

    const tables = ALL_ITEMS.filter((it) => it.table).map((it) => {
      const td = tableData(it);
      return { sheet: it.sheet, headers: td.headers, rows: td.sheetRows };
    });

    return {
      app: 'kuesioner-usahatani-v1',
      id: state.id,
      submittedAt: new Date().toISOString(),
      kode: String(state.v.h_kode ?? '').trim(),
      komoditas: String(state.v.h_komoditas ?? '').trim(),
      tanggal: String(state.v.h_tanggal ?? '').trim(),
      flat,
      tables,
      report: buildReport(),
      raw: state.v,
    };
  }

  /* ---------- tampilan cetak ---------- */
  function renderReport(rep, box) {
    box.replaceChildren();
    box.append(h('h1', {}, rep.title.toUpperCase()), h('p', { class: 'p-sub' }, rep.subtitle));
    const mt = h('table', { class: 'p-meta' });
    for (let i = 0; i < rep.meta.length; i += 2) {
      const a = rep.meta[i];
      const b = rep.meta[i + 1];
      mt.append(h('tr', {}, h('th', {}, a.l), h('td', {}, a.v || '—'), b ? h('th', {}, b.l) : h('th'), b ? h('td', {}, b.v || '—') : h('td')));
    }
    box.append(mt);
    rep.blocks.forEach((b) => {
      box.append(h('h2', {}, `${b.id}. ${b.title.toUpperCase()}`));
      const qa = h('table', { class: 'p-qa' }, h('thead', {}, h('tr', {}, h('th', { class: 'c-no' }, 'No'), h('th', {}, 'Pertanyaan'), h('th', {}, 'Jawaban'))));
      const body = h('tbody');
      qa.append(body);
      let hasQA = false;
      const flush = () => {
        if (hasQA) box.append(qa.cloneNode(true));
        body.replaceChildren();
        hasQA = false;
      };
      b.items.forEach((it) => {
        if (it.table) {
          flush();
          box.append(
            h('h3', {}, `${it.no}. ${it.q}`),
            h(
              'table',
              { class: 'p-grid' },
              h('thead', {}, h('tr', {}, it.table.headers.map((x) => h('th', {}, x)))),
              h('tbody', {}, it.table.rows.map((r) => h('tr', {}, r.map((x) => h('td', {}, x)))))
            )
          );
        } else {
          hasQA = true;
          const ans = h('td', {});
          (it.a || '—').split('\n').forEach((line, i) => {
            if (i) ans.append(h('br'));
            ans.append(line);
          });
          body.append(h('tr', {}, h('td', { class: 'c-no' }, String(it.no)), h('td', {}, it.q), ans));
        }
      });
      flush();
    });
    box.append(h('h2', {}, 'CATATAN PEWAWANCARA'), h('p', { class: 'p-note' }, rep.note || '—'));
  }

  function printCopy() {
    const rep = buildReport();
    renderReport(rep, $('#print-view'));
    const old = document.title;
    document.title = `Kuesioner_${(state.v.h_kode || 'draf').toString().replace(/[^\w-]+/g, '_')}`;
    window.print();
    setTimeout(() => (document.title = old), 500);
  }

  /* ---------- kirim ---------- */
  function validate() {
    const errs = [];
    $$('.invalid').forEach((e) => e.classList.remove('invalid'));
    $$('.err').forEach((e) => e.remove());

    F.meta
      .filter((f) => f.req)
      .forEach((f) => {
        if (!String(state.v[f.key] ?? '').trim()) {
          const el = $(`[data-key="${f.key}"]`);
          markInvalid(el, 'Wajib diisi');
          errs.push({ el, msg: `${f.label} wajib diisi` });
        }
      });

    const consent = state.v[F.consent.key];
    if (consent !== 'Bersedia') {
      errs.push({
        el: $('.consent'),
        msg: consent === 'Tidak bersedia' ? 'Responden tidak bersedia diwawancarai, jadi data tidak disimpan.' : 'Persetujuan responden belum dipilih.',
      });
    }

    $$('#form input[data-kind="num"]').forEach((el) => {
      if (el.closest('[hidden]')) return;
      const n = normNum(el.value);
      if (n === null) {
        markInvalid(el, 'Isi angka atau TT');
        errs.push({ el, msg: `Angka tidak valid: ${el.getAttribute('aria-label')}` });
      } else if (n !== el.value) {
        el.value = n;
        setVal(el.dataset.key, n);
      }
    });
    return errs;
  }

  function showErrors(errs) {
    const box = $('#errors');
    box.replaceChildren();
    if (!errs.length) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.append(h('strong', {}, 'Periksa kembali:'));
    const ul = h('ul');
    errs.slice(0, 8).forEach((er) => {
      const b = h('button', { type: 'button', class: 'linklike' }, er.msg);
      b.addEventListener('click', () => {
        er.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        if (er.el.focus && er.el.tagName !== 'SECTION') er.el.focus({ preventScroll: true });
      });
      ul.append(h('li', {}, b));
    });
    if (errs.length > 8) ul.append(h('li', {}, `…dan ${errs.length - 8} lainnya`));
    box.append(ul);
    errs[0].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function setBusy(on) {
    const b = $('#btn-submit');
    b.disabled = on;
    b.textContent = on ? 'Menyimpan…' : CFG.endpoint ? 'Simpan ke Google Sheets' : 'Selesai & periksa';
  }

  async function submit() {
    const errs = validate();
    showErrors(errs);
    if (errs.length) return;

    if (state.savedId === state.id && !confirm('Responden ini sudah pernah tersimpan. Simpan lagi sebagai data baru?')) return;
    if (state.savedId === state.id) {
      state.id = uid();
      state.savedId = null;
    }

    const payload = buildPayload();
    if (!CFG.endpoint) {
      showResult({ kind: 'local', payload });
      return;
    }

    setBusy(true);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 90000);
    try {
      const res = await fetch(CFG.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        signal: ctl.signal,
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Server menolak data.');
      state.savedId = payload.id;
      scheduleSave();
      showResult({ kind: 'ok', data, payload });
    } catch (err) {
      const msg = err.name === 'AbortError' ? 'Waktu habis. Periksa sinyal internet lalu coba lagi.' : err.message || 'Tidak dapat terhubung ke server.';
      showResult({ kind: 'error', msg, payload });
    } finally {
      clearTimeout(timer);
      setBusy(false);
    }
  }

  function download(name, text, type) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.append(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
  }

  function newRespondent() {
    const keep = {};
    CARRY.forEach((k) => state.v[k] && (keep[k] = state.v[k]));
    state = { id: uid(), v: keep, savedId: null };
    restoreAll();
    window.scrollTo({ top: 0 });
  }

  function showResult(r) {
    const dlg = $('#result');
    const body = $('#result-body');
    body.replaceChildren();
    const btns = h('div', { class: 'actions' });
    const closeBtn = h('button', { type: 'button', class: 'btn' }, 'Tutup');
    closeBtn.addEventListener('click', () => dlg.close());

    const jsonBtn = h('button', { type: 'button', class: 'btn' }, 'Unduh data (JSON)');
    jsonBtn.addEventListener('click', () =>
      download(`kuesioner_${r.payload.kode || 'draf'}.json`, JSON.stringify({ id: r.payload.id, raw: r.payload.raw, report: r.payload.report }, null, 2), 'application/json')
    );
    const printBtn = h('button', { type: 'button', class: 'btn' }, 'Cetak / simpan PDF');
    printBtn.addEventListener('click', () => {
      dlg.close();
      printCopy();
    });

    if (r.kind === 'ok') {
      const d = r.data;
      body.append(
        h('h2', {}, d.duplicate ? 'Data ini sudah tersimpan sebelumnya' : 'Jawaban tersimpan di Google Sheets'),
        h('p', {}, `Responden ${r.payload.kode}${r.payload.komoditas ? ' – ' + r.payload.komoditas : ''}.`)
      );
      const links = h('p', { class: 'links' });
      if (d.pdfUrl) links.append(h('a', { href: d.pdfUrl, target: '_blank', rel: 'noopener' }, 'Buka lembar jawaban (PDF)'));
      if (d.sheetUrl) links.append(h('a', { href: d.sheetUrl, target: '_blank', rel: 'noopener' }, 'Buka rekap (Google Sheets)'));
      body.append(links);
      const again = h('button', { type: 'button', class: 'btn primary' }, 'Isi responden baru');
      again.addEventListener('click', () => {
        dlg.close();
        newRespondent();
      });
      btns.append(again, closeBtn);
    } else if (r.kind === 'error') {
      body.append(
        h('h2', {}, 'Belum tersimpan'),
        h('p', {}, r.msg),
        h('p', { class: 'hint' }, 'Isian Anda aman di perangkat ini. Coba lagi setelah sinyal membaik, atau unduh cadangan.')
      );
      const retry = h('button', { type: 'button', class: 'btn primary' }, 'Coba lagi');
      retry.addEventListener('click', () => {
        dlg.close();
        submit();
      });
      btns.append(retry, jsonBtn, printBtn, closeBtn);
    } else {
      body.append(
        h('h2', {}, 'Isian lengkap'),
        h('p', {}, 'Penyimpanan ke Google Sheets belum diaktifkan, jadi data belum dikirim ke mana pun. Anda dapat mencetak atau mengunduh salinannya.')
      );
      btns.append(printBtn, jsonBtn, closeBtn);
    }
    body.append(btns);
    dlg.showModal();
  }

  /* ---------- mulai ---------- */
  build();
  wire();
  restoreAll();
})();

</script>
</body>
</html>
