<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuesioner Usahatani - Manajemen Usahatani TBP</title>
<style>
:root{--latte:#E8D5BC;--foam:#F7EEDF;--card:#FCF7EE;--ink:#3B281B;--mocha:#6A4631;--caramel:#B07A43;--line:#DCC7AA;--auto:#F2DFBC;--soft:#85654D;--ok:#55743F;--warn:#A4502B;--btn:#6A4631;--btnt:#FBF3E6}
@media (prefers-color-scheme:dark){:root{--latte:#2A1D15;--foam:#34251B;--card:#3B2A1F;--ink:#F3E6D3;--mocha:#D9B48A;--caramel:#D49A5E;--line:#5A4232;--auto:#5A4328;--soft:#C0A486;--ok:#9DBF86;--warn:#E49A78;--btn:#C98F54;--btnt:#2A1D15}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--latte);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--foam);border-bottom:1px solid var(--line)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 6px}
.bar h1{font-size:19px;line-height:1.2}
.bar small{display:block;color:var(--soft);font-size:13px;font-family:system-ui,sans-serif;font-weight:400}
.btn{border:0;background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--mocha);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--caramel);transition:width .25s}
.chipnav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:thin}
.chipnav button{flex:0 0 auto;min-width:34px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;color:var(--soft)}
.chipnav button.done{border-color:var(--ok);color:var(--ok)}
.chipnav button.cur{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
main{padding:20px 0 120px}
.sec{display:none}
.sec.on{display:block}
.sech{margin:6px 0 4px;font-size:27px;line-height:1.2}
.secd{color:var(--soft);margin:0 0 18px;font-size:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.qn{flex:0 0 auto;min-width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-weight:700;font-size:14px;padding:0 6px}
.qh h3{font-size:18px;line-height:1.35;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600}
.qb>*+*{margin-top:12px}
.sl{font-size:14px;color:var(--soft);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--foam);cursor:pointer;font-size:15px;line-height:1.3}
.chip input[type=radio],.chip input[type=checkbox]{accent-color:var(--caramel);margin:0;width:16px;height:16px}
.chip:has(input:checked){background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.chip.tt{font-size:13px;border-style:dashed;color:var(--soft)}
.chip.tt:has(input:checked){color:var(--btnt)}
.xin{width:9.5em;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 8px;font-size:14px}
.clr{border:0;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px}
.inp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--foam);border-radius:10px;padding:0 10px;min-height:42px}
.inp input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:0}
.inp:focus-within{border-color:var(--caramel);box-shadow:0 0 0 2px color-mix(in srgb,var(--caramel) 35%,transparent)}
.inp.auto{background:var(--auto);border-left:4px solid var(--caramel)}
.pre,.suf{color:var(--soft);font-size:14px;white-space:nowrap}
.rst{border:0;background:var(--caramel);color:var(--btnt);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto}
select,textarea{width:100%;border:1px solid var(--line);background:var(--foam);border-radius:10px;padding:10px;min-height:42px}
textarea{min-height:110px;resize:vertical}
.fld .fl{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.rows>*+*{margin-top:10px}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--foam) 60%,var(--card))}
.rt{font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rt .inp{flex:1;min-width:160px}
.calc{margin-top:8px;font-size:14px;color:var(--mocha);font-weight:600}
.calc.bad{color:var(--warn)}
.aid{border:1px dashed var(--caramel);border-radius:14px;padding:14px;margin:0 0 14px;background:var(--auto)}
.aid h3{font-size:17px;margin-bottom:4px}
.aid p{margin:0 0 10px;font-size:14px;color:var(--mocha)}
.note{font-size:13px;color:var(--soft);margin:0 0 14px}
.legend{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--soft);margin-bottom:16px;flex-wrap:wrap}
.legend .inp{min-height:28px;padding:0 10px;font-size:13px}
.intro p{margin:0 0 10px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:15px}
.sum .k{color:var(--soft)}
.sum .v{text-align:right;font-weight:600}
.sum .hr{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.sum .big{font-size:18px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--foam);border-top:1px solid var(--line);padding:10px 0;z-index:5}
.foot .wrap{display:flex;gap:10px;justify-content:space-between;align-items:center}
.foot .st{font-size:13px;color:var(--soft);text-align:center;flex:1}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(680px,94vw);max-height:88vh;padding:0}
dialog::backdrop{background:rgba(40,25,15,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
#pbody{padding:6px 16px 16px}
#pbody h4{margin:16px 0 6px;font-size:17px}
.pr{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pr small{display:block;color:var(--soft);font-size:12px}
.pr input{border:1px solid var(--line);background:var(--foam);border-radius:8px;padding:8px;text-align:right;width:100%}
.drvmsg{margin-top:10px;font-size:14px;min-height:20px}
.drvmsg.ok{color:var(--ok);font-weight:600}
.drvmsg.bad{color:var(--warn);font-weight:600}
.drvmsg a{color:var(--mocha);font-weight:700;margin-left:8px}
#print-view{display:none}
@media print{
 @page{size:A4;margin:14mm}
 html,body{background:#fff!important}
 header.top,main,.foot,dialog{display:none!important}
 #print-view{display:block;color:#000;font:10pt/1.35 Arial,Helvetica,sans-serif}
 #print-view h1{font:700 15pt Arial,sans-serif;margin:0 0 2px}
 #print-view .p-sub{margin:0 0 10px}
 #print-view h2{font:700 11pt Arial,sans-serif;margin:14px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #000;break-after:avoid}
 #print-view h3{font:700 10pt Arial,sans-serif;margin:10px 0 4px;break-after:avoid}
 #print-view table{width:100%;border-collapse:collapse;margin-bottom:8px}
 #print-view th,#print-view td{padding:3px 5px;border:1px solid #888;text-align:left;vertical-align:top;font-size:9pt}
 #print-view th{background:#eee}
 #print-view .p-meta th{width:17%}
 #print-view .p-meta td{width:33%}
 #print-view .c-no{width:6%;text-align:center}
 #print-view .p-qa td:nth-child(2){width:46%}
 #print-view tr{break-inside:avoid}
}
@media(min-width:620px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}.sech{font-size:31px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
 <div class="wrap">
  <div class="bar">
   <h1>Kuesioner Usahatani<small>Manajemen Usahatani, Team-Based Project (TBP)</small></h1>
   <button class="btn alt sm" id="btnPrice" type="button">Harga acuan</button>
  </div>
  <div class="prog"><i id="progBar"></i></div>
  <nav class="chipnav" id="chipnav" aria-label="Bagian kuesioner"></nav>
 </div>
</header>
<main class="wrap" id="stage"></main>
<div class="foot"><div class="wrap">
 <button class="btn alt" id="btnBack" type="button">Kembali</button>
 <div class="st" id="stat"></div>
 <button class="btn" id="btnNext" type="button">Lanjut</button>
</div></div>
<dialog id="dlg">
 <div class="dh"><h3>Harga acuan Bali / Tabanan</h3><button class="btn alt sm" id="dClose" type="button">Tutup</button></div>
 <div id="pbody"></div>
 <div style="padding:0 16px 16px"><button class="btn alt sm" id="dReset" type="button">Kembalikan semua ke harga awal</button></div>
</dialog>
<div id="print-view" aria-hidden="true"></div>
<noscript>Halaman ini membutuhkan JavaScript.</noscript>

<script>
(()=>{
'use strict';
const KEY='tbp_kuesioner_usahatani_v1',YEAR=2026;
/* Alamat Web App Google Apps Script (berakhiran /exec). Boleh dikosongkan:
   alamatnya bisa ditempel sekali lewat halaman Ringkasan dan tersimpan di browser. */
const ENDPOINT='';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- Harga acuan (semua bisa diubah lewat tombol "Harga acuan") ---------- */
const PL=[
['t_cangkul','Alat (harga baru)','Cangkul','Rp per buah',90000,'perkiraan toko tani Bali'],
['t_sabit','Alat (harga baru)','Sabit/parang/gunting pangkas','Rp per buah',75000,'perkiraan'],
['t_semprot','Alat (harga baru)','Alat semprot punggung','Rp per unit',350000,'perkiraan'],
['t_pompa','Alat (harga baru)','Pompa air/mesin','Rp per unit',1500000,'perkiraan'],
['t_traktor','Alat (harga baru)','Traktor/mesin bajak/mesin potong rumput','Rp per unit',20000000,'harga traktor tangan; mesin potong rumput jauh lebih murah'],
['t_angkut','Alat (harga baru)','Motor/pikap/gerobak angkut','Rp per unit',1500000,'harga gerobak; isi manual untuk motor/pikap'],
['t_keranjang','Alat (harga baru)','Keranjang/ember/karung','Rp per set',100000,'perkiraan'],
['l_cangkul','Alat (umur pakai)','Cangkul','tahun',3,''],
['l_sabit','Alat (umur pakai)','Sabit/parang/gunting pangkas','tahun',3,''],
['l_semprot','Alat (umur pakai)','Alat semprot punggung','tahun',4,''],
['l_pompa','Alat (umur pakai)','Pompa air/mesin','tahun',5,''],
['l_traktor','Alat (umur pakai)','Traktor/mesin','tahun',10,''],
['l_angkut','Alat (umur pakai)','Motor/pikap/gerobak','tahun',5,''],
['l_keranjang','Alat (umur pakai)','Keranjang/ember/karung','tahun',2,''],
['bibit','Bibit, pupuk, obat','Bibit/benih padi','Rp per kg',15000,'perkiraan benih padi lokal'],
['kandang_sub','Bibit, pupuk, obat','Pupuk organik bersubsidi','Rp per kg',640,'HET resmi, berlaku sejak 22 Okt 2025'],
['kandang_non','Bibit, pupuk, obat','Pupuk kandang/kompos non-subsidi','Rp per kg',1000,'perkiraan'],
['urea_sub','Bibit, pupuk, obat','Urea bersubsidi','Rp per kg',1800,'HET resmi, berlaku sejak 22 Okt 2025'],
['urea_non','Bibit, pupuk, obat','Urea non-subsidi','Rp per kg',6000,'perkiraan'],
['npk_sub','Bibit, pupuk, obat','NPK Phonska bersubsidi','Rp per kg',1840,'HET resmi, berlaku sejak 22 Okt 2025'],
['npk_non','Bibit, pupuk, obat','NPK non-subsidi','Rp per kg',11000,'perkiraan'],
['sp36','Bibit, pupuk, obat','SP-36/TSP','Rp per kg',6500,'perkiraan'],
['cair','Bibit, pupuk, obat','Pupuk cair/organik','Rp per liter',40000,'perkiraan'],
['hama','Bibit, pupuk, obat','Obat hama/penyakit','Rp per liter',90000,'perkiraan'],
['rumput','Bibit, pupuk, obat','Obat rumput','Rp per liter',70000,'perkiraan'],
['upah','Upah','Upah buruh tani','Rp per hari',100000,'UMK Tabanan 2026 Rp3.287.678 per bulan; upah tani biasanya lebih rendah, sesuaikan'],
['a_gabah_merah','Harga hasil panen','Padi merah Jatiluwih (gabah)','Rp per kg',8500,'kisaran Rp7.000-10.000 (penelitian Unmas)'],
['a_gabah_merah_lo','Harga hasil panen','Padi merah Jatiluwih: terendah','Rp per kg',7000,''],
['a_gabah_merah_hi','Harga hasil panen','Padi merah Jatiluwih: tertinggi','Rp per kg',10000,''],
['a_beras_merah','Harga hasil panen','Beras merah Jatiluwih','Rp per kg',20000,'kisaran Rp15.000-25.000'],
['a_beras_merah_lo','Harga hasil panen','Beras merah: terendah','Rp per kg',15000,''],
['a_beras_merah_hi','Harga hasil panen','Beras merah: tertinggi','Rp per kg',25000,''],
['a_gabah_putih','Harga hasil panen','Gabah padi putih (GKP)','Rp per kg',6500,'mengacu HPP gabah; sesuaikan'],
['a_gabah_putih_lo','Harga hasil panen','Gabah padi putih: terendah','Rp per kg',5500,''],
['a_gabah_putih_hi','Harga hasil panen','Gabah padi putih: tertinggi','Rp per kg',7500,'']
];
const DEF={};PL.forEach(r=>DEF[r[0]]=r[4]);
const ACU=[['gabah_merah','Padi merah Jatiluwih (gabah)'],['beras_merah','Beras merah Jatiluwih'],['gabah_putih','Gabah padi putih (GKP)'],['lain','Lainnya (isi harga sendiri)']];

/* ---------- State ---------- */
let S={v:{},man:{},pr:{},step:0,ep:'',sid:'',saved:''};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)S=Object.assign(S,x)}catch(e){}
if(!S.sid)S.sid=uid();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=k=>S.pr[k]!=null?S.pr[k]:DEF[k];
const UF={kg:1,kwintal:100,ton:1000};
const fmt=n=>isFinite(n)?Math.round(n).toLocaleString('id-ID'):'';
const r2=n=>Math.round(n*100)/100;
const g=id=>{const x=parseFloat(S.v[id]);return isNaN(x)?0:x};
const clean=(s,m)=>{s=String(s).trim();if(/^tt$/i.test(s))return'TT';s=s.replace(/[^\d.,]/g,'');return m?s.replace(/\./g,'').replace(',','.'):s.replace(',','.')};
const $=s=>document.querySelector(s);

function mk(tag,props,...kids){
 const e=document.createElement(tag);
 for(const k in (props||{})){const v=props[k];
  if(k==='class')e.className=v;
  else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
  else if(v===true)e.setAttribute(k,'');
  else if(v!==false&&v!=null)e.setAttribute(k,v);}
 for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
 return e;
}

/* ---------- Registri ---------- */
const IN={},AUTO={},AM={},WR={},RB={},CALC=[],CLR=[],QS=[],EL={},XO={},XS={},MON={};
let CUR=null,CURX=null,SECI=0;
const reg=(id,ex)=>{if(CURX)CURX.push(id);if(CUR&&!ex)CUR.push(id)};
const calc=fn=>{const el=mk('span',{});CALC.push({el,fn});return el};

function refresh(){
 for(let pass=0;pass<2;pass++){
  for(const id in AUTO){
   if(S.man[id])continue;
   let v;try{v=AUTO[id]()}catch(e){v=''}
   v=(v===''||v==null||isNaN(v))?'':String(r2(v));
   S.v[id]=v;
   const inp=IN[id];
   if(inp&&document.activeElement!==inp)inp.value=v===''?'':(AM[id]?fmt(+v):v);
  }
 }
 for(const id in AUTO){
  if(WR[id])WR[id].classList.toggle('auto',!S.man[id]&&S.v[id]!=='');
  if(RB[id])RB[id].hidden=!S.man[id];
 }
 CLR.forEach(([id,b])=>{b.hidden=!S.v[id]});
 CALC.forEach(c=>{const t=c.fn();if(typeof t==='object'){c.el.textContent=t.t;c.el.parentNode&&c.el.parentNode.classList.toggle('bad',!!t.bad)}else c.el.textContent=t});
 progress();save();
}

/* ---------- Pembangun elemen ---------- */
function input(id,o){
 o=o||{};reg(id);
 const inp=mk('input',{type:'text',inputmode:o.txt?'text':'decimal',autocomplete:'off',placeholder:o.ph||'','aria-label':o.al||id});
 IN[id]=inp;
 let v=S.v[id];if(v==null)v='';
 inp.value=(o.m&&v!==''&&v!=='TT'&&!isNaN(v))?fmt(+v):String(v);
 inp.addEventListener('input',()=>{S.v[id]=o.txt?inp.value:clean(inp.value,o.m);if(AUTO[id])S.man[id]=1;refresh()});
 inp.addEventListener('blur',()=>{const x=S.v[id];if(o.m&&x!=null&&x!==''&&x!=='TT'&&!isNaN(x))inp.value=fmt(+x)});
 const w=mk('div',{class:'inp'},o.pre?mk('span',{class:'pre'},o.pre):null,inp,o.u?mk('span',{class:'suf'},o.u):null);
 w.dataset.id=id;EL[id]=w;if(o.m)MON[id]=1;
 if(o.auto){
  AUTO[id]=o.auto;AM[id]=!!o.m;WR[id]=w;
  const b=mk('button',{type:'button',class:'rst',title:'Kembalikan ke nilai otomatis','aria-label':'Kembalikan ke nilai otomatis',onclick:()=>{delete S.man[id];refresh()}},'\u21BA');
  b.hidden=!S.man[id];RB[id]=b;w.append(b);
 }
 return w;
}
function sel(id,opts,def){
 reg(id,1);
 const s=mk('select',{'aria-label':id});s.dataset.id=id;EL[id]=s;
 opts.forEach(x=>{const a=Array.isArray(x)?x:[x,x];s.append(mk('option',{value:a[0]},a[1]))});
 if(S.v[id]==null)S.v[id]=def!=null?def:(Array.isArray(opts[0])?opts[0][0]:opts[0]);
 s.value=S.v[id];
 s.addEventListener('change',()=>{S.v[id]=s.value;refresh()});
 return s;
}
function radio(id,o,opt){
 reg(id);opt=opt||{};
 const wrap=mk('div',{class:'chips'});wrap.dataset.id=id;EL[id]=wrap;XO[id]=o.filter(x=>x.x).map(x=>x.x);
 const items=o.concat(opt.tt===false?[]:[{tt:1}]);
 items.forEach(it=>{
  const val=it.tt?'TT':(it.x||it);
  const r=mk('input',{type:'radio',name:'r_'+id,value:val});
  r.checked=S.v[id]===val;
  r.addEventListener('change',()=>{S.v[id]=val;refresh()});
  const lab=mk('label',{class:'chip'+(it.tt?' tt':'')},r,mk('span',{},it.tt?'TT (tidak tahu)':(it.x?it.x+':':it)));
  if(it.x){
   const xi=id+'_x';XS[id+'|'+it.x]={s:it.s||'',rp:!!it.rp};
   const t=mk('input',{type:'text',class:'xin',placeholder:'isi',inputmode:it.m?'decimal':'text','aria-label':it.x});
   t.value=S.v[xi]||'';
   t.addEventListener('input',()=>{S.v[xi]=it.m?clean(t.value,true):t.value;if(t.value){S.v[id]=val;r.checked=true}refresh()});
   lab.append(t,it.s?mk('span',{},it.s):null);
  }
  wrap.append(lab);
 });
 const clr=mk('button',{type:'button',class:'clr',onclick:()=>{S.v[id]='';wrap.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);refresh()}},'hapus pilihan');
 clr.hidden=!S.v[id];CLR.push([id,clr]);wrap.append(clr);
 return wrap;
}
function check(id,o){
 reg(id);
 const wrap=mk('div',{class:'chips'});wrap.dataset.id=id;EL[id]=wrap;XO[id]=o.filter(x=>x.x).map(x=>x.x);
 const cur=Array.isArray(S.v[id])?S.v[id]:[];
 const boxes=[];
 o.forEach(it=>{
  const val=it.x||it;
  const c=mk('input',{type:'checkbox',value:val});c.checked=cur.includes(val);boxes.push(c);

function calcSummary(){
 const K=kali();
 const pm=(a,per)=>per==='tahun'?a/K:a;
 let rev=0;for(let i=0;i<4;i++)rev+=g('q39_'+i+'_j')*g('q39_'+i+'_h');
 let sapA=0,sapT=0;IN35.forEach(r=>{const t=g('q35_'+r.k+'_j')*g('q35_'+r.k+'_h');sapA+=t;if((S.v['q35_'+r.k+'_a']||'Beli')==='Beli')sapT+=t});
 const lain=g('q36a')+g('q36b')+g('q36c')+g('q36d');
 let upahB=0,upahK=0,hokK=0,hokB=0;
 for(let i=0;i<=JOBS.length;i++){const p='q27_'+i+'_';const jam=g(p+'jm')||8;
  const hk=g(p+'ko')*g(p+'kh')*jam/8,hb=g(p+'bo')*g(p+'bh')*jam/8;
  hokK+=hk;hokB+=hb;upahK+=hk*g(p+'up');upahB+=g(p+'bo')*g(p+'bh')*g(p+'up');}
 let peny=0,rawat=0;for(let i=0;i<=TOOLS.length;i++){const p='q33_'+i+'_';const u=g(p+'u');if(g(p+'h')&&u&&(S.v[p+'ms']||'Milik sendiri')!=='Sewa')peny+=g(p+'h')*.9/u;rawat+=g(p+'b')}
 peny=peny/K;
 const pbb=pm(g('q34a'),S.v.q34a_p),sewa=pm(g('q34b'),S.v.q34b_p),imp=g('q11b')>0&&!g('q11a')?0:pm(g('q34c'),S.v.q34c_p);
 const iuran=g('q34d')+g('q34e');
 const pasar=g('q42a')+g('q42b')+g('q42c');
 const tunai=sapT+lain+upahB+rawat+pbb+sewa+iuran+pasar;
 const dihit=(sapA-sapT)+upahK+peny+imp;
 const total=tunai+dihit;
 const luas=g('q13');
 const kgTot=g('q37_0_t')*UF[S.v.q37_0_s||'kg'];
 return {K,rev,sapT,sapA,lain,upahB,upahK,hokK,hokB,peny,rawat,pbb,sewa,imp,iuran,pasar,tunai,dihit,total,luas,kgTot};
}
function summaryNode(){
 const {rev,sapT,sapA,lain,upahB,upahK,hokK,hokB,peny,rawat,pbb,sewa,imp,iuran,pasar,tunai,total,luas,kgTot}=calcSummary();
 const row=(k,v,cls)=>[mk('div',{class:'k'},k),mk('div',{class:'v '+(cls||'')},v)];
 const rp=n=>'Rp '+fmt(n);
 return mk('div',{class:'sum'},
  row('Penerimaan dari penjualan (no. 39)',rp(rev)),
  mk('div',{class:'hr'}),
  row('Bibit, pupuk, obat yang dibeli',rp(sapT)),

  row('Upah tenaga kerja dibayar',rp(upahB)),
  row('Sewa/perawatan alat, PBB, sewa lahan, iuran',rp(rawat+pbb+sewa+iuran)),
  row('Biaya pemasaran (no. 42)',rp(pasar)),
  row('Total biaya tunai',rp(tunai),'big'),
  mk('div',{class:'hr'}),

  row('Total biaya (tunai + diperhitungkan)',rp(total),'big'),
  mk('div',{class:'hr'}),
  row('Pendapatan atas biaya tunai',rp(rev-tunai),'big'),
  row('Keuntungan atas total biaya',rp(rev-total),'big'),

 );
}

 const mt=mk('table',{class:'p-meta'});
 for(let i=0;i<rep.meta.length;i+=2){const a=rep.meta[i],b=rep.meta[i+1];
  mt.append(mk('tr',{},mk('th',{},a.l),mk('td',{},a.v||'\u2014'),mk('th',{},b?b.l:''),mk('td',{},b?(b.v||'\u2014'):'')));}
 box.append(mt);
 rep.blocks.forEach(b=>{
  box.append(mk('h2',{},b.id+'. '+b.title.toUpperCase()));
  let rows=[];
  const flush=()=>{if(!rows.length)return;
   box.append(mk('table',{class:'p-qa'},mk('thead',{},mk('tr',{},mk('th',{class:'c-no'},'No'),mk('th',{},'Pertanyaan'),mk('th',{},'Jawaban'))),mk('tbody',{},rows)));rows=[]};
  b.items.forEach(it=>{
   if(it.table){flush();
    box.append(mk('h3',{},it.no+'. '+it.q),mk('table',{class:'p-grid'},
     mk('thead',{},mk('tr',{},it.table.headers.map(x=>mk('th',{},x)))),
     mk('tbody',{},it.table.rows.map(r=>mk('tr',{},r.map(x=>mk('td',{},x)))))));
   }else{
    const ans=mk('td',{});
    (it.a||'\u2014').split('\n').forEach((ln,i)=>{if(i)ans.append(mk('br'));ans.append(ln)});
    rows.push(mk('tr',{},mk('td',{class:'c-no'},String(it.no)),mk('td',{},it.q),ans));
   }
  });
  flush();
 });
}
function printCopy(){
 const p=buildPayload();
 renderReport(p.report,$('#print-view'));
 const old=document.title;
 document.title='Kuesioner_'+p.kode;
 window.print();
 setTimeout(()=>{document.title=old},500);
}
function driveSay(msg,text,cls,links){
 msg.className='drvmsg '+(cls||'');msg.textContent=text;
 (links||[]).forEach(l=>msg.append(' ',mk('a',{href:l[1],target:'_blank',rel:'noopener'},l[0])));
}
const driveUrl=()=>(ENDPOINT||S.ep||'').trim();
const driveOk=u=>/^https:\/\/script\.google\.com\/.+\/exec/.test(u);
async function testDrive(msg){
 const u=driveUrl();
 if(!driveOk(u)){driveSay(msg,'Tempel dulu alamat Web App (berakhiran /exec).','bad');return}
 driveSay(msg,'Menguji koneksi...');
 try{const r=await fetch(u);const d=await r.json();driveSay(msg,d.ok?'Terhubung ke Google Drive. '+(d.message||''):'Alamat dikenali tetapi server menolak.',d.ok?'ok':'bad')}
 catch(e){driveSay(msg,'Tidak dapat terhubung. Pastikan deployment diatur "Siapa saja" dan alamatnya berakhiran /exec.','bad')}
}
async function sendDrive(btn,msg){
 const u=driveUrl();
 if(!driveOk(u)){driveSay(msg,'Tempel dulu alamat Web App (berakhiran /exec) di kolom di bawah.','bad');return}
 if(S.v.consent==='Tidak bersedia'&&!confirm('Responden menjawab tidak bersedia. Tetap simpan?'))return;
 if(!String(S.v.q1||'').trim()&&!confirm('Nama petani (no. 1) belum diisi. Tetap simpan?'))return;
 if(S.saved===S.sid){
  if(!confirm('Responden ini sudah pernah tersimpan. Simpan lagi sebagai data baru?'))return;
  S.sid=uid();S.saved='';
 }
 const payload=buildPayload();
 btn.disabled=true;btn.textContent='Menyimpan...';
 driveSay(msg,'Mengirim ke Google Drive, mohon tunggu.');
 const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),90000);
 try{
  const res=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctl.signal});
  const data=await res.json();
  if(!data.ok)throw new Error(data.error||'Server menolak data.');
  S.saved=payload.id;save();
  driveSay(msg,data.duplicate?'Data ini sudah tersimpan sebelumnya, tidak digandakan.':'Tersimpan di Google Drive.','ok',
   [data.pdfUrl?['Buka PDF',data.pdfUrl]:null,data.sheetUrl?['Buka rekap',data.sheetUrl]:null].filter(Boolean));
 }catch(err){
  driveSay(msg,(err.name==='AbortError'?'Waktu habis. Periksa sinyal internet lalu coba lagi.':(err.message||'Tidak dapat terhubung ke server.'))+' Isian tidak hilang: coba kirim lagi, atau pakai Cetak / simpan PDF.','bad');
 }finally{clearTimeout(timer);btn.disabled=false;btn.textContent='Simpan ke Google Drive'}
}

function renderSummary(){
 const box=$('#secSum');box.innerHTML='';
 box.append(mk('h2',{class:'sech'},'Ringkasan dan Simpan'),mk('p',{class:'secd'},'Perkiraan awal dari data yang sudah diisi. Periksa kembali sebelum dipakai.'));
 box.append(mk('div',{class:'q'},summaryNode()));
 const msg=mk('div',{class:'drvmsg',role:'status','aria-live':'polite'});
 const btnDrive=mk('button',{type:'button',class:'btn'},'Simpan ke Google Drive');
 btnDrive.addEventListener('click',()=>sendDrive(btnDrive,msg));
 const ep=mk('input',{type:'url',inputmode:'url',placeholder:'https://script.google.com/macros/s/.../exec','aria-label':'Alamat Web App Google Apps Script'});
 ep.value=ENDPOINT||S.ep||'';ep.disabled=!!ENDPOINT;
 ep.addEventListener('input',()=>{S.ep=ep.value.trim();save()});
 box.append(mk('div',{class:'q'},
  mk('div',{class:'sl'},'Cetak dan simpan'),
  mk('div',{class:'chips'},mk('button',{type:'button',class:'btn alt',onclick:printCopy},'Cetak / simpan PDF'),btnDrive),
  msg,
  mk('div',{style:'margin-top:12px'},
   F('Alamat Web App Google Drive (tempel sekali saja, berakhiran /exec)',mk('div',{class:'inp'},ep)),
   mk('div',{class:'chips',style:'margin-top:8px'},mk('button',{type:'button',class:'btn alt sm',onclick:()=>testDrive(msg)},'Tes koneksi'))),
  mk('p',{class:'note',style:'margin-top:10px'},'Yang tersimpan di Drive: lembar jawaban PDF, cadangan JSON, dan baris baru di Rekap Kuesioner Usahatani. Di layar cetak, pilih "Simpan sebagai PDF".')));
 const stamp=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
 const name=(S.v.q1||'responden').toString().replace(/[^\w]+/g,'_');
 box.append(mk('div',{class:'q'},mk('div',{class:'sl'},'Cadangan di perangkat'),
  mk('div',{class:'chips'},
   mk('button',{type:'button',class:'btn sm alt',onclick:()=>download('kuesioner_'+name+'_'+stamp()+'.json','application/json',JSON.stringify(S.v,null,1))},'Unduh JSON'),
   mk('button',{type:'button',class:'btn sm alt',onclick:()=>{
    const rows=[['kode','jawaban']];
    Object.keys(S.v).forEach(k=>{const v=S.v[k];rows.push([k,Array.isArray(v)?v.join('; '):v])});
    download('kuesioner_'+name+'_'+stamp()+'.csv','text/csv;charset=utf-8','\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n'));
   }},'Unduh CSV'),
   mk('button',{type:'button',class:'btn sm alt',onclick:()=>{
    if(confirm('Mulai responden baru? Jawaban yang sekarang akan dihapus dari layar ini. Pastikan sudah tersimpan ke Drive atau diunduh.')){S.v={};S.man={};S.step=0;S.sid='';S.saved='';save();location.reload()}
   }},'Responden baru'))));
 box.append(mk('div',{class:'q intro'},mk('p',{},'Terima kasih banyak atas waktu, kesediaan, dan jawaban Bapak/Ibu. Semoga hasil wawancara ini bermanfaat bagi kita bersama.'),mk('p',{},'Om Santhi, Santhi, Santhi, Om.')));
}

/* ---------- Dialog harga acuan ---------- */
function openPrices(){
 const body=$('#pbody');body.innerHTML='';let grp='';
 PL.forEach(r=>{
  const k=r[0],money=!/tahun/.test(r[3]);
  if(r[1]!==grp){grp=r[1];body.append(mk('h4',{},grp))}
  const inp=mk('input',{type:'text',inputmode:'decimal','aria-label':r[2]});
  inp.value=money?fmt(P(k)):P(k);
  inp.addEventListener('input',()=>{const v=parseFloat(clean(inp.value,money));if(isNaN(v))delete S.pr[k];else S.pr[k]=v;refresh()});
  inp.addEventListener('blur',()=>{inp.value=money?fmt(P(k)):P(k)});
  body.append(mk('div',{class:'pr'},mk('div',{},mk('b',{},r[2]),mk('small',{},r[3]+(r[5]?', '+r[5]:''))),inp));
 });
 $('#dlg').showModal();
}

/* ---------- Mulai ---------- */
buildAll();
$('#btnNext').addEventListener('click',()=>go(S.step+1));
$('#btnBack').addEventListener('click',()=>go(S.step-1));
$('#btnPrice').addEventListener('click',openPrices);
$('#dClose').addEventListener('click',()=>$('#dlg').close());
$('#dReset').addEventListener('click',()=>{S.pr={};refresh();openPrices()});
go(S.step||0);
})();
